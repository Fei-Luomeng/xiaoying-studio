name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: xiaoying
          MYSQL_USER: xiaoying
          MYSQL_PASSWORD: xiaoying_demo
          MYSQL_ROOT_PASSWORD: root_demo
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Initialize database
        env:
          MYSQL_CONTAINER: ${{ job.services.mysql.id }}
        run: |
          docker exec -i -e MYSQL_PWD=root_demo "$MYSQL_CONTAINER" mysql -uroot xiaoying < database/init/001-schema.sql
          docker exec -i -e MYSQL_PWD=root_demo "$MYSQL_CONTAINER" mysql -uroot xiaoying < database/init/002-seed.sql
      - name: Java tests and package
        working-directory: backend
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/xiaoying?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8
          DB_USERNAME: xiaoying
          DB_PASSWORD: xiaoying_demo
        run: mvn --batch-mode verify
