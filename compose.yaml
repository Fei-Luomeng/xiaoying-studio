name: xiaoying-studio
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-xiaoying}
      MYSQL_USER: ${MYSQL_USER:-xiaoying}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-xiaoying_demo}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_demo}
      TZ: UTC
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql --protocol=TCP -h 127.0.0.1 -u$$MYSQL_USER $$MYSQL_DATABASE -e 'SELECT COUNT(*) FROM templates' > /dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  backend:
    build: ./backend
    environment: &backend-environment
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-xiaoying}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8
      DB_USERNAME: ${MYSQL_USER:-xiaoying}
      DB_PASSWORD: ${MYSQL_PASSWORD:-xiaoying_demo}
      STORAGE_ROOT: /app/storage
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - media-data:/app/storage

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_ORIGIN: http://backend:8080
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

  backend-check:
    profiles: ["checks"]
    build:
      context: ./backend
      target: test
    environment: *backend-environment
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
  media-data:
